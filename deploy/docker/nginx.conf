# The built web app served by nginx (the "static" target of web.Dockerfile): the app shell with its routes, and the
# API behind the same origin (/api and /health go to the api container), so the app needs no API address baked in,
# a phone on the local network reaches both through one port, and no cross-origin rules apply (ADR-0035 §19).

# A relay in front (Tailscale Serve, giving the app an HTTPS address of the machine) says what the device used;
# without one, what this server saw.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}
map $http_x_forwarded_host $forwarded_host {
    default $host;
    "~."    $http_x_forwarded_host;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Attachments and spreadsheet imports pass through to the API.
    client_max_body_size 64m;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Docker's own resolver, re-read every 10 s, so an api container recreated by an update is found again.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /health/ {
        proxy_pass $api;
        proxy_set_header Host $host;
    }

    # Fingerprinted assets never change; the shell, the manifest and the worker are checked on every open.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location ~ ^/(sw|registerSW)\.js$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
